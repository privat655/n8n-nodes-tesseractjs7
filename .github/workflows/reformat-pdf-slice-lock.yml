name: Reformat PDF Slice Lockfile

on:
  push:
    branches:
      - feature/pdf-page-slice

permissions:
  contents: write

jobs:
  format-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-page-slice
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Normalize package lock formatting
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package-lock.json','utf8')); fs.writeFileSync('package-lock.json', JSON.stringify(p, null, '\t') + '\n');"
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Normalize PDF Page Slice lockfile formatting"
          git push origin HEAD:feature/pdf-page-slice
