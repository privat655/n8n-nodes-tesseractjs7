name: Update PDF Slice Lockfile

on:
  push:
    branches:
      - feature/pdf-page-slice

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-page-slice
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for PDF Page Slice"
          git push origin HEAD:feature/pdf-page-slice
